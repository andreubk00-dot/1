name: OSTATOK — Loot and mouse Godot QA
on:
  push:
    branches: [ostatok-loot-mouse-polish-1380]
  workflow_dispatch:
jobs:
  godot-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify official Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fLSs --retry 3 -o /tmp/godot.zip 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          mkdir -p /tmp/godot-bin
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Import project assets
        shell: bash
        run: timeout 540s /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import --quit
      - name: Verify loot cards and mouse-fire gating
        shell: bash
        run: timeout 180s /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/test_loot_mouse_polish_1380.gd
      - name: Existing weapon-action regression
        shell: bash
        run: timeout 180s /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/test_weapon_action_cycles.gd
      - name: Existing loot rarity regression
        shell: bash
        run: timeout 180s /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/test_loot_rarity_risk.gd
