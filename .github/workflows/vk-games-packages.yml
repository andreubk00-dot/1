name: VK Games and OK HTML5 Packages
on:
  workflow_dispatch:
  push:
    branches:
      - endless-defenders-vk-ok-platform-builds-v1824
    paths:
      - tools/build-vk-games.cjs
      - tools/vk-bridge-entry.js
      - tests/vk-games-platform.test.cjs
      - .github/workflows/vk-games-packages.yml
      - iphone/index.html
  pull_request:
    branches:
      - endless-defenders-iphone-v1810
    paths:
      - tools/build-vk-games.cjs
      - tools/vk-bridge-entry.js
      - tests/vk-games-platform.test.cjs
      - .github/workflows/vk-games-packages.yml
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned VK SDK and bundler
        run: npm install --no-save --no-package-lock @vkontakte/vk-bridge@2.15.0 esbuild@0.25.12
      - name: Build VK and OK packages
        run: node tools/build-vk-games.cjs
      - name: Verify both games and advertising safeguards
        run: node tests/vk-games-platform.test.cjs
      - name: Package standalone games
        run: |
          (cd dist/vk && zip -q -r ../../vk-games-html5.zip index.html bridge.bundle.js)
          (cd dist/ok && zip -q -r ../../odnoklassniki-html5.zip index.html bridge.bundle.js)
          unzip -l vk-games-html5.zip
          unzip -l odnoklassniki-html5.zip
      - name: Upload VK Games HTML5 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: vk-games-html5
          path: vk-games-html5.zip
      - name: Upload Odnoklassniki HTML5 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: odnoklassniki-html5
          path: odnoklassniki-html5.zip
